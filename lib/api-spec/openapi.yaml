        campaignGoals:
          type: array
          items:
            type: string
        targetAudience:
          type: string
        deliverables:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            type: string
        riskFactors:
          type: array
          items:
            type: string
      required:
        - missingFields
        - executiveSummary
        - campaignGoals
        - targetAudience
        - deliverables
        - recommendations
        - riskFactors

