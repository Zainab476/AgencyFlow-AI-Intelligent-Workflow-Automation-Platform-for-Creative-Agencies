components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - createdAt

    RegisterInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
        password:
          type: string
          minLength: 6
      required:
        - name
        - email
        - password

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    Client:
      type: object
      properties:
        id:
          type: integer
        companyName:
          type: string
        contactPerson:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - companyName
        - contactPerson
        - email
        - createdAt

    ClientInput:
      type: object
      properties:
        companyName:
          type: string
          minLength: 1
        contactPerson:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
      required:
        - companyName
        - contactPerson
        - email

    ClientUpdate:
      type: object
      properties:
        companyName:
          type: string
          minLength: 1
        contactPerson:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string

    ProjectStatus:
      type: string
      enum:
        - planning
        - active
        - on_hold
        - completed
        - cancelled

    Project:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: ["string", "null"]
        campaignName:
          type: string
        budget:
          type: ["number", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/ProjectStatus"
        createdAt:
          type: string
      required:
        - id
        - clientId
        - campaignName
        - status
        - createdAt

    ProjectInput:
      type: object
      properties:
        clientId:
          type: integer
        campaignName:
          type: string
          minLength: 1
        budget:
          type: number
        startDate:
          type: string
        endDate:
          type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
      required:
        - clientId
        - campaignName

    ProjectUpdate:
      type: object
      properties:
        clientId:
          type: integer
        campaignName:
          type: string
          minLength: 1
        budget:
          type: number
        startDate:
          type: string
        endDate:
          type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"

    # ── Team Member schemas ──────────────────────────────────────────
    MemberRole:
      type: string
      enum:
        - project_manager
        - designer
        - copywriter
        - marketing_specialist

    ProjectMember:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
        createdAt:
          type: string
      required:
        - id
        - projectId
        - name
        - email
        - role
        - createdAt

    ProjectMemberInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
      required:
        - name
        - email
        - role

    ProjectMemberUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"

    # ── Task schemas ─────────────────────────────────────────────────
    TaskStatus:
      type: string
      enum:
        - todo
        - in_progress
        - review
        - done

    TaskPriority:
      type: string
      enum:
        - low
        - medium
        - high
        - urgent

    Task:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        projectName:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        assignedMemberId:
          type: ["integer", "null"]
        assignedMemberName:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        priority:
          $ref: "#/components/schemas/TaskPriority"
        status:
          $ref: "#/components/schemas/TaskStatus"
        createdAt:
          type: string
      required:
        - id
        - projectId
        - title
        - priority
        - status
        - createdAt

    TaskInput:
      type: object
      properties:
        projectId:
          type: integer
        title:
          type: string
          minLength: 1
        description:
          type: string
        assignedMemberId:
          type: integer
        dueDate:
          type: string
        priority:
          $ref: "#/components/schemas/TaskPriority"
        status:
          $ref: "#/components/schemas/TaskStatus"
      required:
        - projectId
        - title

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        assignedMemberId:
          type: integer
        dueDate:
          type: string
        priority:
          $ref: "#/components/schemas/TaskPriority"
        status:
          $ref: "#/components/schemas/TaskStatus"

    TaskStatusPatch:
      type: object
      properties:
