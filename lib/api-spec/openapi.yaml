          items:
            type: string
        active:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, url, secret, eventTypes, active, createdAt, updatedAt]

    WebhookConfigInput:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        secret:
          type: string
        eventTypes:
          type: array
          items:
            type: string
        active:
          type: boolean
      required: [name, url, eventTypes]

    WebhookConfigUpdate:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        secret:
          type: string
        eventTypes:
          type: array
          items:
            type: string
        active:
          type: boolean

